<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
	<h1>Edit Student Data</h1>
	<form method="post" action="/student/update">
	<table>
	<tr>
		<td>學號</td>
		<td>姓名</td>
		<td>身高</td>
	</tr>
	<tr>
		<td>{{ data.stuid }} <input type="hidden" name="stuid" value="{{ data.stuid}}"></td>
		<td><input type="text" name="name" value="{{ data.name}}"></td>
		<td><input type="number" name="height" value="{{ data.height}}"></td>
	</tr>
	</table>
	<input type="submit">
	</form>
</body>
</html>
