<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>報名成功</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
<body>
	<h1>報名成功</h1>
	<table>
	<tr><th>報名編號</th><td>{{ r.registration_id }}</td></tr>
	<tr><th>姓名</th><td>{{ r.name }}</td></tr>
	<tr><th>報名時間</th><td>{{ r.registered_at | tw }}</td></tr>
	<tr><th>活動</th><td><a href="/activities/{{ r.activity_id }}">{{ r.title }}</a></td></tr>
	<tr><th>時間</th><td>{{ r.start_time | tw }} ~ {{ r.end_time | tw }}</td></tr>
	<tr><th>地點</th><td>{{ r.location }}</td></tr>
	</table>
	<p><a href="/">回活動列表</a></p>
</body>
</html>
